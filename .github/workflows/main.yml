name: 每日兩次抓取氣象資料

on:
  schedule:
    - cron: '17 10,22 * * *'  # UTC 10:17、22:17，即台灣時間 18:17、翌日 06:17
  workflow_dispatch:

jobs:
  run-weather-script:
    runs-on: ubuntu-24.04
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}

    steps:
    - name: 下載程式碼
      uses: actions/checkout@v7

    - name: 安裝 Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: 安裝必要套件
      run: |
        python -m pip install --upgrade pip
        pip install gspread oauth2client requests beautifulsoup4 pandas
        pip install selenium

    - name: 建立憑證JSON檔（base64 解碼）
      run: |
        echo "${{ secrets.GCP_CREDENTIALS_JSON }}" | base64 -d > service_account.json

    - name: 執行主程式
      run: python main.py
